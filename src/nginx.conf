server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ =404;
    }

    location /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
